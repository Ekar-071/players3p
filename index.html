<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Players3P</title>
<style>
:root{--bg:#14121f;--card:#1e1b2e;--fg:#f1eefc;--mut:#9a94b8;--ac:#ff6b9d;--ac2:#5eead4}
@media(prefers-color-scheme:light){:root{--bg:#f4f1fb;--card:#fff;--fg:#1b1730;--mut:#6b6588;--ac:#e0377a;--ac2:#0f9d8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:440px}
h1{font-size:1.5rem;margin:0 0 16px;letter-spacing:.5px}
h1 span{color:var(--ac)}
.now{background:var(--card);border-radius:20px;padding:20px}
.cover{height:150px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:flex-end;gap:5px;padding:14px;overflow:hidden}
.cover i{flex:1;background:rgba(255,255,255,.85);border-radius:3px;height:12%;transition:height .15s}
#title{font-size:1.2rem;font-weight:700;margin:16px 0 2px}
#artist{color:var(--mut);margin:0 0 14px;font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--ac)}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:.8rem}
.ctrl{display:flex;justify-content:center;align-items:center;gap:14px;margin:12px 0}
button{background:none;border:0;color:var(--fg);font-size:1.4rem;cursor:pointer;border-radius:50%;width:46px;height:46px}
button:hover{background:rgba(127,127,127,.18)}
button:focus-visible{outline:2px solid var(--ac)}
button.on{color:var(--ac)}
#pp{background:var(--ac);color:#fff;width:60px;height:60px;font-size:1.6rem}
#pp:hover{background:var(--ac)}
.vol{display:flex;align-items:center;gap:8px;color:var(--mut)}
ul{list-style:none;padding:0;margin:16px 0 0}
li{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;cursor:pointer}
li:hover{background:var(--card)}
li.cur{background:var(--card);color:var(--ac);font-weight:700}
li small{color:var(--mut);font-weight:400}
label.add{display:block;margin-top:14px;text-align:center;color:var(--ac2);cursor:pointer;font-size:.9rem}
label.add input{display:none}
</style>
</head>
<body>
<main>
<h1>Players<span>3P</span></h1>
<section class="now">
  <div class="cover" id="bars" aria-hidden="true"></div>
  <p id="title">—</p><p id="artist">&nbsp;</p>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Progression">
  <div class="times"><span id="t1">0:00</span><span id="t2">0:00</span></div>
  <div class="ctrl">
    <button id="shuf" title="Aléatoire" aria-label="Aléatoire">⇄</button>
    <button id="prev" aria-label="Précédent">⏮</button>
    <button id="pp" aria-label="Lecture / pause">▶</button>
    <button id="next" aria-label="Suivant">⏭</button>
    <button id="rep" title="Répéter" aria-label="Répéter">↻</button>
  </div>
  <div class="vol">🔈<input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume"></div>
</section>
<ul id="list"></ul>
<label class="add">+ Ajouter mes fichiers audio<input id="files" type="file" accept="audio/*" multiple></label>
</main>
<script>
// --- Playlist : morceaux générés (Web Audio) ; notes = [midi, durée en temps], 0 = silence
const rep=(p,n)=>Array.from({length:n},()=>p).flat();
const tracks=[
 {title:"Aube",artist:"Synthé local",bpm:96,wave:"triangle",notes:rep([[60,1],[64,1],[67,1],[72,1],[67,1],[64,1],[62,1],[65,1],[69,1],[74,1],[69,1],[65,1]],3)},
 {title:"Pixel Run",artist:"Synthé local",bpm:132,wave:"square",notes:rep([[57,.5],[0,.5],[64,.5],[60,.5],[69,.5],[0,.5],[67,.5],[64,.5],[55,.5],[62,.5],[67,.5],[71,.5]],5)},
 {title:"Nuit douce",artist:"Synthé local",bpm:70,wave:"sine",notes:rep([[57,2],[60,2],[64,2],[60,1],[62,1],[55,2],[59,2],[62,2],[59,1],[57,1]],2)}
];
const $=id=>document.getElementById(id);
let ctx,master,nodes=[],cur=0,playing=false,startAt=0,offset=0,audio=new Audio(),shuffle=false,repeat=false;
const dur=t=>t.url?(audio.duration||0):t.notes.reduce((s,n)=>s+n[1],0)*60/t.bpm;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const bars=$("bars");for(let i=0;i<16;i++)bars.appendChild(document.createElement("i"));
function ensureCtx(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.connect(ctx.destination);master.gain.value=$("vol").value/100}if(ctx.state==="suspended")ctx.resume()}
function stopNodes(){nodes.forEach(o=>{try{o.stop()}catch(e){}});nodes=[]}
function schedule(t,from){
  stopNodes();let time=0;
  for(const [m,b] of t.notes){
    const d=b*60/t.bpm;
    if(m&&time+d>from){
      const o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime;
      const s=now+Math.max(0,time-from),e=now+time+d-from;
      o.type=t.wave;o.frequency.value=440*2**((m-69)/12);
      g.gain.setValueAtTime(0.0001,s);g.gain.linearRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.001,e);
      o.connect(g).connect(master);o.start(s);o.stop(e+.05);nodes.push(o);
    }
    time+=d;
  }
}
function position(){const t=tracks[cur];return t.url?audio.currentTime:(playing?offset+ctx.currentTime-startAt:offset)}
function play(from=offset){
  const t=tracks[cur];ensureCtx();offset=from;
  if(t.url){audio.src=t.url;audio.currentTime=from;audio.play()}else{startAt=ctx.currentTime;schedule(t,from)}
  playing=true;ui();
}
function pause(){
  const t=tracks[cur];offset=Math.min(position(),dur(t));
  t.url?audio.pause():stopNodes();playing=false;ui();
}
function load(i,autoplay=true){
  if(playing)pause();cur=(i+tracks.length)%tracks.length;offset=0;
  const t=tracks[cur];$("title").textContent=t.title;$("artist").textContent=t.artist;
  if(t.url){audio.src=t.url;audio.onloadedmetadata=()=>{$("t2").textContent=fmt(audio.duration)}}
  $("t2").textContent=fmt(dur(t));renderList();if(autoplay)play(0);else ui();
}
function next(){load(shuffle?Math.floor(Math.random()*tracks.length):cur+1)}
audio.onended=()=>end();
function end(){playing=false;if(repeat)load(cur);else next()}
function ui(){$("pp").textContent=playing?"⏸":"▶"}
function renderList(){
  $("list").innerHTML="";
  tracks.forEach((t,i)=>{const li=document.createElement("li");li.className=i===cur?"cur":"";
    li.innerHTML=`<span>${t.title}</span><small>${fmt(dur(t))}</small>`;li.onclick=()=>load(i);$("list").appendChild(li)});
}
// Boucle d'affichage : progression + barres animées
function tick(){
  const t=tracks[cur],d=dur(t),p=Math.min(position(),d);
  if(d){$("seek").value=p/d*1000;$("t1").textContent=fmt(p);if(playing&&!t.url&&p>=d)end()}
  [...bars.children].forEach((b,i)=>b.style.height=(playing?15+Math.abs(Math.sin(Date.now()/230+i*1.3))*80:12)+"%");
  requestAnimationFrame(tick);
}
$("pp").onclick=()=>playing?pause():play();
$("next").onclick=next;$("prev").onclick=()=>position()>3?(pause(),play(0)):load(cur-1);
$("seek").oninput=e=>{const f=e.target.value/1000*dur(tracks[cur]);playing?(pause(),play(f)):offset=f;if(tracks[cur].url)audio.currentTime=f};
$("vol").oninput=e=>{const v=e.target.value/100;audio.volume=v;if(master)master.gain.value=v};
$("shuf").onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle("on",shuffle)};
$("rep").onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle("on",repeat)};
$("files").onchange=e=>{
  const first=tracks.length;
  [...e.target.files].forEach(f=>tracks.push({title:f.name.replace(/\.[^.]+$/,""),artist:"Mon fichier",url:URL.createObjectURL(f)}));
  load(first);
};
audio.volume=.7;load(0,false);tick();
</script>
</body>
</html>
